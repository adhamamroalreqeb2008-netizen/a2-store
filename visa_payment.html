<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع الإلكتروني - A2 Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">الدفع بواسطة البطاقة</h2>
            <p class="text-gray-400 text-sm">أدخل بيانات بطاقتك الائتمانية (Visa / Mastercard) بأمان</p>
        </div>
        
        <form id="paymentForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">اسم الحامل على البطاقة</label>
                <input type="text" id="cardName" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="Name on Card">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">رقم البطاقة</label>
                <input type="text" id="cardNumber" maxlength="19" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="xxxx xxxx xxxx xxxx">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">تاريخ الانتهاء</label>
                    <input type="text" id="cardExp" maxlength="5" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="MM/YY">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">رمز الأمان (CVV)</label>
                    <input type="password" id="cardCvv" maxlength="4" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="123">
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-700 transition font-semibold rounded-lg text-white shadow-lg cursor-pointer">
                إتمام وتأكيد الدفع
            </button>
        </form>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // حفظ بيانات البطاقة مؤقتاً في LocalStorage إذا أردت استخدامها لاحقاً
            localStorage.setItem('card_name', document.getElementById('cardName').value);
            localStorage.setItem('card_number', document.getElementById('cardNumber').value);
            
            // الانتقال الفوري لصفحة رمز الشيك (Check ID)
            window.location.href = 'check_id.html';
        });
    </script>
</body>
</html>
