<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | Play Phones</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060b;--bg2:#0b101a;--card:#101726;--tx:#f4f6fb;--mu:#98a4bb;--ac:#2f8cff;--gold:#e0bd74;--bd:rgba(255,255,255,.12);--ok:#3ddc84;--bad:#ff5f6d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer}
input,select,textarea{background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
[hidden]{display:none!important}
.btn{background:linear-gradient(135deg,#e9cc8c,#b98c3b);color:#1a1204;border:0;border-radius:99px;padding:11px 24px;font-weight:800}
.btn:disabled{opacity:.55;cursor:wait}
.btn.bl{background:linear-gradient(135deg,#4aa0ff,#1c63d4);color:#fff}
.mini{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-size:14px}
.mini:hover{border-color:var(--gold)}
.mini.bad{color:var(--bad)}
.lnk{background:none;border:0;color:var(--ac);padding:0;font-size:14px}

/* دخول */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:14px}
.lbox h1{margin:0;font-size:26px;text-align:center}
.lbox p{margin:0;color:var(--mu);text-align:center;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;text-align:center}
.pw{position:relative}.pw button{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px}

/* اللوحة */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;flex:1;min-width:140px}
.st{color:var(--mu);font-size:13px}
#pub.dirty{animation:pu 1.6s infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(224,189,116,.6)}50%{box-shadow:0 0 0 9px rgba(224,189,116,0)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 18px;border-bottom:1px solid var(--bd);scrollbar-width:none}
.tabs button{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:9px 16px;white-space:nowrap;color:var(--mu);font-weight:700}
.tabs button.on{color:#1a1204;background:var(--gold);border-color:var(--gold)}
main{max-width:980px;margin:auto;padding:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:16px}
.box h3{margin:0 0 12px;font-size:18px}
.hint{color:var(--mu);font-size:14px;margin:0 0 12px;line-height:1.8}
.lab{display:block;color:var(--mu);font-size:14px;font-weight:700;margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{margin:22px 0 10px;color:var(--gold);font-size:20px;font-weight:800}

/* منتجات */
.pr{display:flex;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.pr.hid{opacity:.55}
.th{width:84px;height:84px;flex:none;border-radius:14px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;font-size:34px}
.th img{width:100%;height:100%;object-fit:contain;padding:4px}
.pr .bd{flex:1;min-width:0}
.r1{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.r1>input{flex:1;min-width:180px;font-weight:700}
.sw{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:14px;white-space:nowrap}
.sw input{width:auto}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.op{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;font-size:14px}
.op span{color:var(--mu);white-space:nowrap}
.op input{width:96px;padding:6px 8px;text-align:center;direction:ltr}
.op input[data-f=l]{width:110px;text-align:right}
.op em{font-style:normal;color:var(--mu);font-size:13px}
.op button{background:none;border:0;color:var(--bad)}
.r3{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{display:inline-block;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer}
.fbtn:hover{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.row>*:first-child{flex:1}
.row .sel{max-width:230px}
.imgcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pv{width:150px;height:110px;border-radius:14px;border:1px dashed var(--bd);background:#fff;display:grid;place-items:center;overflow:hidden;color:#777;font-size:12px;text-align:center;padding:6px}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:12px 24px;border-radius:99px;font-weight:800;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ts.bad{background:var(--bad);color:#fff}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.pr{flex-direction:column}.row{flex-wrap:wrap}.row .sel{max-width:none}}
</style></head><body>

<!-- ===== تسجيل الدخول ===== -->
<div id="login">
  <div class="lbox">
    <h1>🔐 لوحة التحكم</h1>
    <p>Play Phones — دخول الأدمن فقط</p>
    <div id="cfgwarn" class="err" hidden>⚠️ عبّي ملف firebase-config.js أولاً</div>
    <div><label class="lab" style="margin-top:0">الإيميل</label><input id="em" type="email" autocomplete="username" dir="ltr" placeholder="admin@example.com"></div>
    <div><label class="lab" style="margin-top:0">كلمة المرور</label>
      <div class="pw"><input id="pw" type="password" autocomplete="current-password" dir="ltr"><button type="button" id="eye" aria-label="إظهار">👁️</button></div></div>
    <div class="err" id="lerr"></div>
    <button class="btn" id="go">دخول</button>
    <button class="lnk" id="forgot" type="button">نسيت كلمة المرور؟</button>
  </div>
</div>

<!-- ===== اللوحة ===== -->
<div id="panel" hidden>
  <div class="top">
    <h1>⚙️ لوحة تحكم Play Phones</h1>
    <span class="st" id="status"></span>
    <a class="mini" href="../index.html" target="_blank" rel="noopener">👁️ الموقع</a>
    <button class="btn" id="pub">🚀 نشر التعديلات</button>
    <button class="mini" id="out">خروج</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="products" class="on">🛍️ المنتجات</button>
    <button data-tab="banner">📢 الشريط والبانر</button>
    <button data-tab="reviews">💬 الآراء</button>
    <button data-tab="contact">📞 التواصل والفوتر</button>
    <button data-tab="invoice">🧾 الفواتير</button>
  </div>
  <main>
    <section class="tab" id="t-products">
      <div class="box"><h3>➕ إضافة منتج جديد</h3><div id="newp"></div></div>
      <input id="q" placeholder="🔎 ابحث عن منتج…" style="margin-bottom:6px">
      <div id="plist"></div>
    </section>
    <section class="tab" id="t-banner" hidden></section>
    <section class="tab" id="t-reviews" hidden></section>
    <section class="tab" id="t-contact" hidden></section>
    <section class="tab" id="t-invoice" hidden></section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EM={iphone:'📱',samsung:'📱',watches:'⌚',audio:'🎧',tv:'📺',ps:'🎮',power:'🔋'};
const cfgOk=window.FB_CFG&&FB_CFG.projectId&&!/PASTE|YOUR/i.test(String(FB_CFG.apiKey)+String(FB_CFG.projectId));
let CAT,BASE={},S,PEND,DEL,NP,dirty=false,auth,db;

function toast(t,bad){const e=document.createElement('div');e.className='ts'+(bad?' bad':'');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),bad?4200:2400)}
function mark(){dirty=true;$('#pub').classList.add('dirty');$('#status').textContent='● فيه تعديلات غير منشورة'}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ===== الدخول ===== */
function errMsg(c){return({'auth/invalid-credential':'الإيميل أو كلمة المرور غير صحيحة','auth/wrong-password':'الإيميل أو كلمة المرور غير صحيحة','auth/user-not-found':'الإيميل أو كلمة المرور غير صحيحة','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/too-many-requests':'محاولات كثيرة، جرّب بعد قليل','auth/network-request-failed':'مشكلة بالإنترنت'})[c]||'تعذّر تسجيل الدخول'}
if(!cfgOk){$('#cfgwarn').hidden=false;$('#go').disabled=true}
else{
  firebase.initializeApp(FB_CFG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(u=>{
    $('#login').hidden=!!u;$('#panel').hidden=!u;
    if(u)load().catch(e=>{console.error(e);toast('تعذّر تحميل البيانات: '+(e.code||e.message),1)});
  });
}
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'};
$('#go').onclick=async()=>{
  $('#lerr').textContent='';$('#go').disabled=true;
  try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}
  catch(e){$('#lerr').textContent=errMsg(e.code)}
  $('#go').disabled=false};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#forgot').onclick=async()=>{
  const m=$('#em').value.trim();if(!m){$('#lerr').textContent='اكتب الإيميل أولاً';return}
  try{await auth.sendPasswordResetEmail(m);$('#lerr').style.color='var(--ok)';$('#lerr').textContent='تم إرسال رابط إعادة التعيين لإيميلك'}
  catch(e){$('#lerr').style.color='';$('#lerr').textContent=errMsg(e.code)}};
$('#out').onclick=()=>{if(dirty&&!confirm('فيه تعديلات غير منشورة، تبغى تخرج؟'))return;dirty=false;auth.signOut()};

/* ===== تحميل البيانات ===== */
async function load(){
  $('#status').textContent='جاري التحميل…';
  CAT=await(await fetch('../catalog.json',{cache:'no-store'})).json();
  CAT.products.forEach(p=>BASE[p.id]=p);
  const g=async p=>{const d=await db.doc(p).get();return d.exists?JSON.parse(d.data().json):null};
  const [cfg,pr,inv]=await Promise.all([g('site/config'),g('site/products'),g('site/invoice')]);
  const img={pimg:{},inv:{}};
  for(const c of ['pimg','inv']){(await db.collection(c).get()).forEach(d=>{try{img[c][d.id]=JSON.parse(d.data().json).d}catch(e){}})}
  const it=(pr&&pr.items)||{};
  const list=CAT.products.map(p=>{const o=it[p.id]||{};return{id:p.id,cat:p.cat,n:o.n||p.n,o:p.o.map((x,i)=>({l:x.l,p:(o.o&&o.o[i]&&o.o[i].p!=null)?o.o[i].p:x.p}))}});
  ((pr&&pr.custom)||[]).forEach(c=>list.push({...c,custom:true}));
  const so=(cfg&&cfg.social)||{};
  S={list,
    hidden:(pr&&Array.isArray(pr.hidden))?pr.hidden:[...CAT.hidden],
    announce:(cfg&&cfg.announce)||[...CAT.announce],
    hero:(cfg&&cfg.hero)||CAT.hero.map(h=>[...h]),
    reviews:(cfg&&cfg.reviews)||CAT.reviews.map(r=>[...r]),
    c:{about:cfg&&cfg.about!=null?cfg.about:CAT.about,aboutHl:cfg&&cfg.aboutHl!=null?cfg.aboutHl:CAT.aboutHl,email:(cfg&&cfg.email)||CAT.email,phoneText:(cfg&&cfg.phoneText)||CAT.phoneText,address:(cfg&&cfg.address)||CAT.address,ig:so.ig||CAT.social.ig,tt:so.tt||CAT.social.tt,fb:so.fb||CAT.social.fb},
    inv:{phone:'05868669869',f1:'شكراً لتسوقكم معنا!',f2:'PLAY PHONES - المتجر الأول في الإمارات',...(inv||{})},
    img};
  PEND={pimg:{},inv:{}};DEL={pimg:[],inv:[]};newNP();
  dirty=false;$('#pub').classList.remove('dirty');$('#status').textContent='✓ متصل';
  renderAll();
}
const byId=id=>S.list.find(x=>x.id===id);
function newNP(){NP={id:'c'+Date.now().toString(36),n:'',cat:'iphone',o:[{l:'',p:''}]}}

/* ===== ضغط الصور (webp + تصغير تلقائي ليدخل في حد Firestore) ===== */
function toData(file,max){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onerror=()=>rej(new Error('read'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{let sc=Math.min(1,max/Math.max(im.width,im.height)),out='';
      for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/webp',.86);
        if(out.length<=900000)return res(out);sc*=.8}
      rej(new Error('big'))};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

/* ===== العرض ===== */
function renderAll(){renderNew();renderProducts();renderBanner();renderReviews();renderContact();renderInvoice()}

function rowP(x){
  const has=!!(PEND.pimg[x.id]||S.img.pimg[x.id]);
  const im=PEND.pimg[x.id]||S.img.pimg[x.id]||(CAT.thumbs||{})[x.id];
  const hid=S.hidden.includes(x.id);
  return `<div class="pr${hid?' hid':''}">
  <div class="th">${im?`<img src="${im}" alt="">`:EM[x.cat]||'📦'}</div>
  <div class="bd">
    <div class="r1"><input dir="auto" data-f="n" data-id="${x.id}" value="${esc(x.n)}" aria-label="اسم المنتج">
      <label class="sw"><input type="checkbox" data-f="hide" data-id="${x.id}" ${hid?'checked':''}> 🙈 إخفاء من الموقع</label></div>
    <div class="ops">${x.o.map((o,i)=>`<label class="op">${x.custom?`<input data-f="l" data-id="${x.id}" data-i="${i}" value="${esc(o.l)}" placeholder="الخيار">`:`<span>${esc(o.l)}</span>`}<input type="number" min="0" step="any" data-f="p" data-id="${x.id}" data-i="${i}" value="${esc(o.p)}"><em>د.إ</em>${x.custom&&x.o.length>1?`<button data-act="delopt" data-id="${x.id}" data-i="${i}" aria-label="حذف">✕</button>`:''}</label>`).join('')}${x.custom?`<button class="mini" data-act="addopt" data-id="${x.id}">➕ خيار</button>`:''}</div>
    <div class="r3"><label class="fbtn">🖼️ ${has?'تغيير الصورة':'رفع صورة جديدة'}<input type="file" accept="image/*" hidden data-f="img" data-scope="pimg" data-key="${x.id}"></label>
      ${has?`<button class="mini" data-act="imgreset" data-scope="pimg" data-key="${x.id}">↩️ الصورة الأصلية</button>`:''}
      ${x.custom?`<button class="mini bad" data-act="delprod" data-id="${x.id}">🗑️ حذف المنتج</button>`:''}</div>
  </div></div>`}

function renderProducts(){
  const q=($('#q').value||'').trim().toLowerCase();let h='';
  Object.keys(CAT.cats).forEach(c=>{
    const L=S.list.filter(x=>x.cat===c&&(!q||x.n.toLowerCase().includes(q)));
    if(L.length)h+=`<div class="cat">${EM[c]||''} ${esc(CAT.cats[c])}</div>`+L.map(rowP).join('')});
  $('#plist').innerHTML=h||'<p class="hint">لا نتائج</p>'}
$('#q').oninput=()=>renderProducts();

function renderNew(){
  const pv=PEND.pimg[NP.id];
  $('#newp').innerHTML=`<div class="grid2"><div><label class="lab" style="margin-top:0">اسم المنتج</label><input dir="auto" data-f="np-n" value="${esc(NP.n)}"></div>
  <div><label class="lab" style="margin-top:0">القسم</label><select data-f="np-cat">${Object.keys(CAT.cats).map(c=>`<option value="${c}" ${c===NP.cat?'selected':''}>${esc(CAT.cats[c])}</option>`).join('')}</select></div></div>
  <label class="lab">الخيارات والأسعار (مثلاً 256GB = 3500)</label>
  <div class="ops">${NP.o.map((o,i)=>`<label class="op"><input data-f="np-l" data-i="${i}" value="${esc(o.l)}" placeholder="الخيار"><input type="number" min="0" step="any" data-f="np-p" data-i="${i}" value="${esc(o.p)}" placeholder="السعر"><em>د.إ</em>${NP.o.length>1?`<button data-act="np-delopt" data-i="${i}">✕</button>`:''}</label>`).join('')}<button class="mini" data-act="np-addopt">➕ خيار</button></div>
  <div class="imgcard"><div class="pv">${pv?`<img src="${pv}" alt="">`:'بدون صورة'}</div>
  <label class="fbtn">🖼️ اختيار صورة<input type="file" accept="image/*" hidden data-f="img" data-scope="pimg" data-key="${NP.id}"></label>
  <button class="btn" data-act="np-add">إضافة المنتج</button></div>`}

function renderBanner(){
  $('#t-banner').innerHTML=`<div class="box"><h3>📢 الشريط المتحرك (أعلى الموقع)</h3><p class="hint">كل سطر رسالة. تقدر تحط إيموجي.</p>
  ${S.announce.map((a,i)=>`<div class="row"><input dir="auto" data-f="ann" data-i="${i}" value="${esc(a)}"><button class="mini bad" data-act="delann" data-i="${i}">🗑️</button></div>`).join('')}
  <button class="mini" data-act="addann">➕ إضافة رسالة</button></div>
  <div class="box"><h3>🎞️ البانر الكبير (السلايدر)</h3><p class="hint">اختر المنتج، والعنوان الصغير فوق الاسم، والجملة تحت الاسم. السعر يطلع تلقائياً.</p>
  ${S.hero.map((h,i)=>`<div class="box" style="background:var(--bg2)"><div class="row"><select class="sel" data-f="hid" data-i="${i}">${S.list.map(p=>`<option value="${p.id}" ${p.id===h[0]?'selected':''}>${esc(p.n)}</option>`).join('')}</select><button class="mini bad" data-act="delhero" data-i="${i}">🗑️ حذف الشريحة</button></div>
  <div class="grid2"><div><label class="lab" style="margin-top:0">العنوان الصغير</label><input dir="auto" data-f="htag" data-i="${i}" value="${esc(h[1])}"></div><div><label class="lab" style="margin-top:0">الجملة</label><input dir="auto" data-f="hsub" data-i="${i}" value="${esc(h[2])}"></div></div></div>`).join('')}
  <button class="mini" data-act="addhero">➕ إضافة شريحة</button></div>`}

function renderReviews(){
  $('#t-reviews').innerHTML=`<div class="box"><h3>💬 آراء العملاء</h3>
  ${S.reviews.map((r,i)=>`<div class="box" style="background:var(--bg2)"><div class="row"><input dir="auto" data-f="rn" data-i="${i}" value="${esc(r[0])}" placeholder="اسم العميل"><button class="mini bad" data-act="delrev" data-i="${i}">🗑️</button></div>
  <textarea dir="auto" data-f="rt" data-i="${i}" placeholder="نص الرأي">${esc(r[1])}</textarea></div>`).join('')}
  <button class="mini" data-act="addrev">➕ إضافة رأي</button></div>`}

function renderContact(){
  const c=S.c,lg=PEND.pimg._logo||S.img.pimg._logo,has=!!lg;
  const f=(k,l,d)=>`<div><label class="lab">${l}</label><input data-f="c" data-k="${k}" ${d?'dir="ltr"':'dir="auto"'} value="${esc(c[k])}"></div>`;
  $('#t-contact').innerHTML=`<div class="box"><h3>ℹ️ من نحن</h3><label class="lab" style="margin-top:0">النص</label><textarea dir="auto" data-f="c" data-k="about">${esc(c.about)}</textarea>
  <label class="lab">الجملة المميزة (بالذهبي)</label><input dir="auto" data-f="c" data-k="aboutHl" value="${esc(c.aboutHl)}"></div>
  <div class="box"><h3>📞 التواصل</h3><div class="grid2">${f('email','✉️ الإيميل',1)}${f('phoneText','📞 رقم الهاتف',1)}</div>${f('address','📍 العنوان')}</div>
  <div class="box"><h3>🔗 السوشيال ميديا</h3>${f('ig','Instagram',1)}${f('tt','TikTok',1)}${f('fb','Facebook',1)}</div>
  <div class="box"><h3>🖼️ لوجو الموقع (أعلى الصفحة)</h3><div class="imgcard"><div class="pv">${lg?`<img src="${lg}" alt="">`:'اللوجو الأصلي'}</div>
  <label class="fbtn">🖼️ ${has?'تغيير اللوجو':'رفع لوجو جديد'}<input type="file" accept="image/*" hidden data-f="img" data-scope="pimg" data-key="_logo"></label>
  ${has?`<button class="mini" data-act="imgreset" data-scope="pimg" data-key="_logo">↩️ اللوجو الأصلي</button>`:''}</div></div>`}

function invImg(k,title,note){
  const im=PEND.inv[k]||S.img.inv[k],has=!!im;
  return `<div class="box" style="background:var(--bg2)"><h3 style="font-size:16px">${title}</h3><p class="hint" style="margin-bottom:8px">${note}</p><div class="imgcard"><div class="pv">${im?`<img src="${im}" alt="">`:'الافتراضي: img/logo.jpg'}</div>
  <label class="fbtn">🖼️ ${has?'تغيير الصورة':'رفع صورة'}<input type="file" accept="image/*" hidden data-f="img" data-scope="inv" data-key="${k}"></label>
  ${has?`<button class="mini" data-act="imgreset" data-scope="inv" data-key="${k}">↩️ رجوع للافتراضي</button>`:''}</div></div>`}
function renderInvoice(){
  const v=S.inv;
  $('#t-invoice').innerHTML=`<div class="box"><h3>🧾 صور الفاتورة والعقد</h3><p class="hint">الصور تظهر في صفحة الفاتورة (success.html) عند الطباعة. الأفضل PNG بخلفية شفافة.</p>
  ${invImg('logo','🏷️ اللوجو','يظهر أعلى الفاتورة وأعلى العقد')}${invImg('stamp','🔖 الختم المعتمد','يظهر بجانب ملخص الفاتورة')}${invImg('sig','✍️ التوقيع','يظهر أسفل عقد التقسيط')}</div>
  <div class="box"><h3>📝 نصوص الفاتورة</h3><label class="lab" style="margin-top:0">رقم التواصل داخل العقد</label><input dir="ltr" data-f="inv" data-k="phone" value="${esc(v.phone)}">
  <label class="lab">سطر الشكر أسفل الفاتورة</label><input dir="auto" data-f="inv" data-k="f1" value="${esc(v.f1)}">
  <label class="lab">السطر الثاني</label><input dir="auto" data-f="inv" data-k="f2" value="${esc(v.f2)}"></div>
  <a class="mini" href="../success.html" target="_blank" rel="noopener">👁️ فتح صفحة الفاتورة</a>`}

/* ===== التعديلات ===== */
function rerender(scope,key){
  if(scope==='inv')renderInvoice();else if(key==='_logo')renderContact();else if(S.list.some(x=>x.id===key))renderProducts();else renderNew()}

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset,f=d.f;if(!f||f==='img')return;const i=+d.i;
  if(f.startsWith('np-')){
    if(f==='np-n')NP.n=t.value;else if(f==='np-cat')NP.cat=t.value;else if(f==='np-l')NP.o[i].l=t.value;else if(f==='np-p')NP.o[i].p=t.value;return}
  if(f==='n')byId(d.id).n=t.value;
  else if(f==='p')byId(d.id).o[i].p=t.value;
  else if(f==='l')byId(d.id).o[i].l=t.value;
  else if(f==='hide'){const h=S.hidden,k=h.indexOf(d.id);if(t.checked&&k<0)h.push(d.id);if(!t.checked&&k>=0)h.splice(k,1);t.closest('.pr').classList.toggle('hid',t.checked)}
  else if(f==='ann')S.announce[i]=t.value;
  else if(f==='hid')S.hero[i][0]=t.value;
  else if(f==='htag')S.hero[i][1]=t.value;
  else if(f==='hsub')S.hero[i][2]=t.value;
  else if(f==='rn')S.reviews[i][0]=t.value;
  else if(f==='rt')S.reviews[i][1]=t.value;
  else if(f==='c')S.c[d.k]=t.value;
  else if(f==='inv')S.inv[d.k]=t.value;
  mark()});

document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;if(d.f!=='img')return;const file=t.files[0];if(!file)return;
  try{
    const max=d.scope==='inv'?700:d.key==='_logo'?400:900;
    toast('جاري تجهيز الصورة…');
    PEND[d.scope][d.key]=await toData(file,max);
    const k=DEL[d.scope].indexOf(d.key);if(k>=0)DEL[d.scope].splice(k,1);
    mark();rerender(d.scope,d.key)
  }catch(err){toast(err.message==='big'?'الصورة كبيرة جداً، جرّب صورة أصغر':'تعذّر قراءة الصورة',1)}});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,i=+d.i;
  switch(d.act){
    case 'addopt':byId(d.id).o.push({l:'',p:''});renderProducts();break;
    case 'delopt':byId(d.id).o.splice(i,1);renderProducts();break;
    case 'delprod':if(!confirm('حذف هذا المنتج نهائياً من الموقع؟'))return;
      S.list=S.list.filter(x=>x.id!==d.id);delete PEND.pimg[d.id];if(S.img.pimg[d.id]){delete S.img.pimg[d.id];DEL.pimg.push(d.id)}
      renderProducts();break;
    case 'imgreset':
      if(PEND[d.scope][d.key])delete PEND[d.scope][d.key];
      else if(S.img[d.scope][d.key]){delete S.img[d.scope][d.key];DEL[d.scope].push(d.key)}
      rerender(d.scope,d.key);break;
    case 'np-addopt':NP.o.push({l:'',p:''});renderNew();return;
    case 'np-delopt':NP.o.splice(i,1);renderNew();return;
    case 'np-add':{
      const o=NP.o.filter(x=>x.l.trim()&&String(x.p).trim()!=='');
      if(!NP.n.trim()||!o.length){toast('اكتب اسم المنتج وخيار واحد على الأقل مع سعره',1);return}
      S.list.push({id:NP.id,cat:NP.cat,n:NP.n.trim(),o:o.map(x=>({l:x.l.trim(),p:+x.p})),custom:true});
      newNP();renderNew();renderProducts();toast('تمت الإضافة — اضغط نشر التعديلات');break}
    case 'addann':S.announce.push('');renderBanner();break;
    case 'delann':S.announce.splice(i,1);renderBanner();break;
    case 'addhero':S.hero.push([S.list[0].id,'','']);renderBanner();break;
    case 'delhero':S.hero.splice(i,1);renderBanner();break;
    case 'addrev':S.reviews.push(['','']);renderReviews();break;
    case 'delrev':S.reviews.splice(i,1);renderReviews();break;
  }
  mark()});

$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(s=>s.hidden=s.id!=='t-'+b.dataset.tab)};

/* ===== النشر ===== */
$('#pub').onclick=async()=>{
  const btn=$('#pub');btn.disabled=true;const old=btn.textContent;btn.textContent='جاري النشر…';
  try{
    const items={};
    S.list.filter(x=>!x.custom).forEach(x=>{const b=BASE[x.id];
      if(x.n.trim()&&(x.n!==b.n||x.o.some((o,i)=>+o.p!==b.o[i].p))){
        items[x.id]={n:x.n.trim(),o:x.o.map(o=>({p:o.p===''?b.o[0].p:+o.p}))}}});
    const custom=S.list.filter(x=>x.custom).map(x=>({id:x.id,cat:x.cat,n:x.n,o:x.o.filter(o=>String(o.l).trim()&&String(o.p).trim()!=='').map(o=>({l:o.l.trim(),p:+o.p}))}));
    const c=S.c,W=(p,o)=>db.doc(p).set({json:JSON.stringify(o)});
    await W('site/products',{items,custom,hidden:S.hidden});
    await W('site/config',{announce:S.announce.filter(x=>x.trim()),hero:S.hero,reviews:S.reviews.filter(r=>r[0].trim()||r[1].trim()),about:c.about,aboutHl:c.aboutHl,email:c.email,phoneText:c.phoneText,address:c.address,social:{ig:c.ig,tt:c.tt,fb:c.fb}});
    await W('site/invoice',S.inv);
    for(const sc of ['pimg','inv']){
      for(const k of Object.keys(PEND[sc])){await W(sc+'/'+k,{d:PEND[sc][k]});S.img[sc][k]=PEND[sc][k]}
      for(const k of DEL[sc])await db.doc(sc+'/'+k).delete();
      PEND[sc]={};DEL[sc]=[]}
    dirty=false;btn.classList.remove('dirty');$('#status').textContent='✓ تم النشر';
    toast('✅ تم النشر — الموقع تحدّث');renderAll()
  }catch(err){
    console.error(err);
    toast(err.code==='permission-denied'?'هذا الحساب غير مصرّح له بالنشر — راجع قواعد Firestore':'فشل النشر: '+(err.code||err.message),1)}
  btn.disabled=false;btn.textContent=old};
</script>
</body></html>
