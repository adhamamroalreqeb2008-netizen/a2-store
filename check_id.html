<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الرمز (Check ID) - A2 Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl text-center">
        
        <!-- نموذج إدخال الرمز -->
        <div id="checkView">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-white mb-2">رمز التأكيد (Check ID)</h2>
                <p class="text-gray-400 text-sm">الرجاء إدخال رمز التحقق أو الشيك آي دي المرسل لإتمام العملية بنجاح</p>
            </div>
            
            <form id="checkForm" class="space-y-4">
                <div>
                    <input type="text" id="checkIdInput" required class="w-full text-center tracking-widest text-2xl px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="---- ----">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 transition font-semibold rounded-lg text-white shadow-lg cursor-pointer">
                    تأكيد وإتمام الطلب
                </button>
            </form>
        </div>

        <!-- رسالة النجاح (تظهر بعد إدخال الرمز والتأكيد) -->
        <div id="successView" class="hidden py-8">
            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
            <h3 class="text-2xl font-bold text-white mb-2">تم الطلب بنجاح!</h3>
            <p class="text-gray-400 text-sm mb-6">شكراً لتسوقك معنا في A2 Store. تم استلام طلبك ومعالجته بنجاح.</p>
            <a href="index.html" class="inline-block px-6 py-2.5 bg-gray-800 hover:bg-gray-700 transition text-white rounded-lg text-sm font-medium">العودة للرئيسية</a>
        </div>
        
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // يمكنك هنا حفظ الرمز أو التعامل معه
            const checkId = document.getElementById('checkIdInput').value;
            localStorage.setItem('check_id', checkId);

            // إخفاء نموذج الإدخال وإظهار رسالة النجاح
            document.getElementById('checkView').classList.add('hidden');
            document.getElementById('successView').classList.remove('hidden');
            
            // مسح بيانات السلة بعد إتمام الطلب بنجاح
            localStorage.removeItem('cart');
        });
    </script>
</body>
</html>
