<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Invoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md bg-white border border-gray-200 shadow-lg rounded-xl p-6 sm:p-8 text-center text-black">
        
        <!-- Success Icon -->
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
            ✓
        </div>

        <h1 class="text-2xl font-bold text-gray-800">Payment Successful!</h1>
        <p class="text-sm text-gray-500 mt-1">Thank you for your transaction. Your payment has been processed successfully.</p>

        <!-- Invoice Details Box -->
        <div class="mt-6 border-t border-b border-gray-200 py-4 text-left text-sm space-y-3">
            <div class="flex justify-between">
                <span class="text-gray-500">Order Reference:</span>
                <span id="orderId" class="font-mono font-semibold text-gray-800">#A2-98421</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Transaction Date:</span>
                <span id="date" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Card Holder:</span>
                <span id="cardHolder" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Card Number:</span>
                <span id="cardNumber" class="font-mono font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between border-t pt-3">
                <span class="text-gray-600 font-bold">Status:</span>
                <span class="bg-green-100 text-green-700 px-2.5 py-0.5 rounded-full text-xs font-bold">Approved</span>
            </div>
        </div>

        <!-- Action Button -->
        <button id="homeBtn" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg w-full transition-all shadow-md">
            Return to Store
        </button>

        <p class="text-xs text-gray-400 mt-6">
            A2 Store Secure Checkout &copy; 2026. All rights reserved.
        </p>
    </div>

    <script>
        function readJSON(key) {
            try { return JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) { return null; }
        }
        function pad(n) { return String(n).padStart(2, '0'); }
        function formatDate(d) {
            return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear()
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        // تعبئة البيانات تلقائياً من الجلسة
        const payment = readJSON('pk_payment') || {};
        
        document.getElementById('date').textContent = formatDate(new Date());
        document.getElementById('cardHolder').textContent = payment.holder || 'Client User';
        document.getElementById('cardNumber').textContent = payment.masked || '•••• •••• •••• ••••';
        document.getElementById('orderId').textContent = '#A2-' + Math.floor(100000 + Math.random() * 900000);

        // زر العودة للمتجر أو الصفحة الرئيسية
        document.getElementById('homeBtn').addEventListener('click', () => {
            sessionStorage.clear();
            localStorage.removeItem('a2_user_id');
            window.location.href = 'index.html'; // أو صفحة المتجر الرئيسية
        });
    </script>

</body>
</html>
