<script>
  // قائمة أسعار المنتجات الأساسية لضمان قراءتها دائماً
  const PROD_PRICES = {
    's25': 5000,
    's25ultra': 5700,
    'ip16pro': 4200,
    'ip16promax': 5100,
    'ps5': 2100,
    'watch': 1500
  };

  const PROD_NAMES = {
    's25': 'Samsung Galaxy A25',
    's25ultra': 'Samsung Galaxy S25 Ultra',
    'ip16pro': 'iPhone 16 Pro',
    'ip16promax': 'iPhone 16 Pro Max',
    'ps5': 'PlayStation 5',
    'watch': 'Smart Watch'
  };

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0].replace(/-/g, '/');
    const randomInv = 'INV-' + Math.floor(100000 + Math.random() * 900000);

    document.getElementById('invNum').textContent = randomInv;
    document.getElementById('invDate').textContent = today;
    document.getElementById('orderDate').textContent = today;

    // جلب بيانات السلة والعميل
    const cart = JSON.parse(localStorage.getItem('a2cart') || '[]');
    const orderInfo = JSON.parse(localStorage.getItem('a2_order_info') || '{}');

    // تعبئة بيانات العميل
    if (orderInfo.name) document.getElementById('custName').textContent = orderInfo.name;
    if (orderInfo.phone) document.getElementById('custPhone').textContent = orderInfo.phone;
    if (orderInfo.city || orderInfo.address) document.getElementById('custCity').textContent = orderInfo.city || orderInfo.address;
    if (orderInfo.payMethod) document.getElementById('payMethod').textContent = orderInfo.payMethod;

    const tbody = document.getElementById('itemsTable');
    let totalGross = 0;

    if (!cart || cart.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:20px; color:#5f7188;">لا توجد عناصر مضافة في السلة</td></tr>`;
      return;
    }

    let rowsHtml = '';
    
    cart.forEach(item => {
      // 1. تحديد اسم المنتج من السلة أو من المعرف k
      const key = item.k || item.id;
      const productName = item.name || item.n || PROD_NAMES[key] || 'هاتف ذكي / جهاز إلكتروني';
      
      // 2. تحديد الكمية
      const productQty = Number(item.qty || item.q || 1);
      
      // 3. قراءة السعر من السلة أو افتراضه من قائمة الأسعار
      let unitPrice = Number(item.price || item.p || item.pr || PROD_PRICES[key] || 1500);

      const itemTotal = unitPrice * productQty;
      totalGross += itemTotal;

      rowsHtml += `
        <tr>
          <td>
            <span class="prod-name">${productName}</span>
            ${item.option || item.o ? `<span class="prod-sub">${item.option || item.o}</span>` : ''}
          </td>
          <td>${productQty}</td>
          <td style="font-weight: 700;">${unitPrice.toLocaleString()} د.إ</td>
          <td>0.00 د.إ</td>
          <td style="font-weight: 700; color: #0b3b68;">${itemTotal.toLocaleString()} د.إ</td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml;

    // 4. تعبئة الإجماليات
    document.getElementById('subTotal').textContent = totalGross.toLocaleString() + ' د.إ';
    document.getElementById('taxAmount').textContent = '0.00 د.إ';
    document.getElementById('grandTotal').textContent = totalGross.toLocaleString() + ' د.إ';
  });
</script>
