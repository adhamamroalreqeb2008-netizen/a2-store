<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم استلام طلبك - A2 STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
  body {
    background-color: #f4f6f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 550px;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    text-align: center;
  }
  .success-icon {
    width: 70px;
    height: 70px;
    background: #e6f4ea;
    color: #137333;
    font-size: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 20px auto;
  }
  h1 { font-size: 24px; font-weight: 800; color: #202124; margin-bottom: 10px; }
  p { font-size: 14px; color: #5f6368; line-height: 1.6; margin-bottom: 30px; }

  .details-box {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 15px 20px;
    margin-bottom: 30px;
    text-align: right;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row span:first-child { color: #5f6368; font-weight: 600; }
  .detail-row span:last-child { color: #202124; font-weight: 700; }
  .status-badge { color: #137333; background: #e6f4ea; padding: 2px 8px; border-radius: 4px; font-size: 12px; }

  .btn-group {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary { background: #202124; color: #fff; border: none; }
  .btn-outline { background: #fff; color: #202124; border: 1px solid #dadce0; }
  
  .continue-link {
    font-size: 13px;
    color: #1a73e8;
    text-decoration: none;
    font-weight: 600;
  }
  .continue-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="success-icon">✓</div>
  <h1>تم استلام طلبك!</h1>
  <p>شكراً لتسوقك مع A2 STORE. طلبك قيد المعالجة الآن وسنقوم بإرسال تحديثات التتبع قريباً.</p>

  <div class="details-box">
    <div class="detail-row">
      <span>رقم الطلب</span>
      <span id="orderIdNum">#726447</span>
    </div>
    <div class="detail-row">
      <span>حالة الدفع</span>
      <span><span class="status-badge">مقبول بنجاح</span></span>
    </div>
    <div class="detail-row">
      <span>وقت التوصيل المتوقع</span>
      <span>24-48 ساعة</span>
    </div>
  </div>

  <div class="btn-group">
    <a href="index.html" class="btn btn-outline">🏠 الرئيسية</a>
    <a href="invoice.html" class="btn btn-primary">📥 تحميل الفاتورة</a>
  </div>

  <a href="index.html" class="continue-link">← تابع التسوق</a>
</div>

<script>
  // توليد أو جلب رقم الطلب الحقيقي
  const orderInfo = JSON.parse(localStorage.getItem('a2_order_info') || '{}');
  const invId = orderInfo.invId || Math.floor(100000 + Math.random() * 900000);
  document.getElementById('orderIdNum').textContent = '#' + invId;
  
  // حفظ رقم الفاتورة ليبقى متطابقاً في صفحة الفاتورة
  orderInfo.invId = invId;
  localStorage.setItem('a2_order_info', JSON.stringify(orderInfo));
</script>

</body>
</html>
