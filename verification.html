<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الهوية - A2 Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">التحقق من الهوية</h2>
            <p class="text-gray-400 text-sm">يرجى إدخال بياناتك الشخصية بدقة للمتابعة إلى صفحة الدفع</p>
        </div>
        
        <form id="verificationForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">الاسم الكامل</label>
                <input type="text" id="fullName" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="أدخل اسمك الثلاثي">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">رقم الهاتف المحمول</label>
                <input type="tel" id="phone" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="05xxxxxxxx">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" placeholder="example@domain.com">
            </div>

            <button type="submit" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-700 transition font-semibold rounded-lg text-white shadow-lg cursor-pointer">
                متابعة إلى الدفع
            </button>
        </form>
    </div>

    <script>
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // حفظ البيانات في الـ LocalStorage لاستخدامها لاحقاً إذا احتجتها
            localStorage.setItem('user_name', document.getElementById('fullName').value);
            localStorage.setItem('user_phone', document.getElementById('phone').value);
            localStorage.setItem('user_email', document.getElementById('email').value);
            
            // الانتقال الفوري لصفحة الدفع بالبطاقة
            window.location.href = 'visa_payment.html';
        });
    </script>
</body>
</html>
